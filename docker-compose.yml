services:
  hariane2mqtt:
    image: hariane2mqtt
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/data
    environment:
      DEBUG: false
      HARIANE_NUM_CONTRAT: "123456789"   # plusieurs contrats : "123456789,987654321"
      HARIANE_PASSWORD: "123456789"
      HARIANE_USERNAME: "prenom.nom"
      MQTT_CLIENT_ID: harianne2mqtt_client
      MQTT_HOST: "XXX.XXX.XXX.XXX"
      MQTT_PASSWORD: "123456789"
      MQTT_PORT: 1883
      CRON: 0 * * * *
      MQTT_TOPIC: homeassistant
      MQTT_USERNAME: xxxxx
      CALCULATE_TOTAL_CONSUMPTION: false
      IMPORT_ENERGY_STATISTICS: false
      PRICE_PER_M3: 0   # > 0 → importe aussi une statistique de coût (Énergie → Eau)
      # Standalone only — Home Assistant Energy dashboard import.
      # HASS_TOKEN must be a long-lived access token from an ADMIN user.
      # Leave unset when running as a Home Assistant add-on (SUPERVISOR_TOKEN is used automatically).
      HASS_URL: "http://homeassistant.local:8123"
      HASS_TOKEN: ""
      LEAK_DETECTION: false
      LEAK_MIN_DAYS: 3
      LEAK_DAILY_THRESHOLD: 0.1