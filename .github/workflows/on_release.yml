name: publish container

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            dockerfile: Dockerfile
          - arch: arm64
            os: ubuntu-24.04-arm   # native arm64 runner (QEMU emulation breaks the .NET build)
            dockerfile: Dockerfile-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lower case owner name
        run: echo "REPOSITORY_LC=${REPOSITORY,,}" >> ${GITHUB_ENV}
        env:
          REPOSITORY: '${{ github.repository }}'

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.REPOSITORY_LC }}:${{ github.ref_name }}-${{ matrix.arch }}
            ${{ env.REPOSITORY_LC }}:latest-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set lower case owner name
        run: echo "REPOSITORY_LC=${REPOSITORY,,}" >> ${GITHUB_ENV}
        env:
          REPOSITORY: '${{ github.repository }}'

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          for tag in "${{ github.ref_name }}" latest; do
            docker buildx imagetools create -t "${REPOSITORY_LC}:${tag}" \
              "${REPOSITORY_LC}:${tag}-amd64" \
              "${REPOSITORY_LC}:${tag}-arm64"
          done
